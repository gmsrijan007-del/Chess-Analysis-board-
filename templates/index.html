<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101210">
  <title>Chess — Stockfish 19</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard.min.css">
  <style>
    :root { color-scheme: dark; --bg:#101210; --panel:#191c19; --line:#303630; --text:#f4f3ed; --muted:#a3aaa1; --accent:#c6e2a8; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:radial-gradient(ellipse at 50% 0%, #293329 0, transparent 55%), repeating-linear-gradient(135deg, #ffffff04 0 1px, transparent 1px 14px), var(--bg); }
    main { width:min(100%, 520px); }
    h1 { margin:0 0 7px; text-align:center; font-size:clamp(34px, 8vw, 48px); line-height:1; letter-spacing:-.06em; font-weight:650; }
    .subtitle { margin:0 0 25px; text-align:center; color:var(--muted); font-size:14px; }
    .card { padding:clamp(14px, 4vw, 22px); border:1px solid var(--line); border-radius:18px; background:#191c19ed; box-shadow:0 24px 80px #0007; }
    #board { width:100%; overflow:hidden; border-radius:5px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:15px; color:var(--muted); font-size:13px; }
    .turn { display:flex; align-items:center; gap:8px; color:var(--text); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
    button { width:100%; margin-top:16px; padding:13px 16px; border:0; border-radius:10px; background:var(--accent); color:#172016; font-size:14px; font-weight:700; cursor:pointer; }
    button:hover { background:#d5ecbe; }
    button:disabled { opacity:.65; cursor:wait; }
    #result { min-height:51px; margin-top:12px; padding:14px; border:1px solid var(--line); border-radius:10px; background:#111411; text-align:center; font-size:14px; color:var(--muted); }
    #result strong { color:var(--text); font-size:17px; }
    #result.error { color:#f0a29b; }
    @media(max-width:420px) { body{padding:14px} .subtitle{margin-bottom:18px} }
  </style>
</head>
<body>
  <main>
    <h1>Chess.</h1>
    <p class="subtitle">A simple board. Stockfish 19 analysis.</p>
    <section class="card" aria-label="Chess board and analysis">
      <div id="board" aria-label="Interactive chessboard"></div>
      <div class="row"><span class="turn"><span id="dot" class="dot"></span><span id="turn">White to move</span></span><span id="count">Move 1</span></div>
      <button id="analyze" type="button">Analyze position</button>
      <div id="result" role="status" aria-live="polite">Make a move, then ask the engine.</div>
    </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard.min.js"></script>
  <script>
    const game = new Chess();
    const board = Chessboard('board', {
      draggable: true,
      position: 'start',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDragStart: (source, piece) => {
        if (game.game_over() || (game.turn() === 'w' && piece[0] === 'b') || (game.turn() === 'b' && piece[0] === 'w')) return false;
      },
      onDrop: (source, target) => {
        if (!game.move({ from: source, to: target, promotion: 'q' })) return 'snapback';
        update();
        document.getElementById('result').textContent = 'Position changed. Analyze when ready.';
      },
      onSnapEnd: () => board.position(game.fen())
    });
    function update() {
      const white = game.turn() === 'w';
      document.getElementById('turn').textContent = white ? 'White to move' : 'Black to move';
      document.getElementById('dot').style.background = white ? '#f4f3ed' : '#687168';
      document.getElementById('count').textContent = 'Move ' + (Math.floor(game.history().length / 2) + 1);
    }
    document.getElementById('analyze').addEventListener('click', async () => {
      const button = document.getElementById('analyze');
      const result = document.getElementById('result');
      button.disabled = true;
      button.textContent = 'Thinking…';
      result.classList.remove('error');
      result.textContent = 'Stockfish is analyzing…';
      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fen: game.fen() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Analysis failed.');
        result.innerHTML = '<strong>' + escapeHtml(data.best_move) + '</strong> &nbsp;·&nbsp; ' + escapeHtml(data.evaluation);
      } catch (error) {
        result.textContent = error.message || 'Could not reach the analyzer.';
        result.classList.add('error');
      } finally {
        button.disabled = false;
        button.textContent = 'Analyze position';
      }
    });
    function escapeHtml(value) {
      const element = document.createElement('span');
      element.textContent = value;
      return element.innerHTML;
    }
    update();
    window.addEventListener('resize', () => board.resize());
  </script>
</body>
</html>
